<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>AfriCloud AZ-900 Prep | Adaptive Exam Coach (#1MillionDevs)</title>
    <meta name="description" content="AI-assisted, offline-capable AZ-900 exam preparation tool built for the #1MillionDevs Movement. Incorporates learning styles, real-life African analogies, spaced repetition, and exam readiness tracking." />
  </head>
  <body class="bg-[#0b0f19] text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Progressive Web App Service Worker for offline capability & local notifications
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('AfriCloud PWA Service Worker Registered:', reg.scope);
          }).catch((err) => {
            console.warn('PWA registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
